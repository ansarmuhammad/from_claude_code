apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: development

resources:
  - ../../base
  - namespace.yaml

replicas:
  - name: api-service
    count: 1
  - name: worker-service
    count: 1
  - name: web-frontend
    count: 1

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - ENVIRONMENT=development

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: api-service
    newName: ghcr.io/ansarmuhammad/from_claude_code/api-service
    newTag: dev
  - name: worker-service
    newName: ghcr.io/ansarmuhammad/from_claude_code/worker-service
    newTag: dev
  - name: web-frontend
    newName: ghcr.io/ansarmuhammad/from_claude_code/web-frontend
    newTag: dev
