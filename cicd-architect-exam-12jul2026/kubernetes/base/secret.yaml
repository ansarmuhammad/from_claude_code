# EXAMPLE / DEV-ONLY TEMPLATE - do not put real credentials here.
# In a real environment this Secret would be created out-of-band (sealed-secrets,
# external-secrets-operator, vault-injector, etc.) rather than committed via
# kustomize stringData. Values below intentionally mirror docker-compose.yml
# so the manifests are runnable as-is for practice/exam purposes.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/part-of: cicd-architect-exam
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/appdb"
  REDIS_URL: "redis://redis:6379"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
