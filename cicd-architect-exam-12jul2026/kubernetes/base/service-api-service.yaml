apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: api-service
    app: api-service
spec:
  type: ClusterIP
  # Deliberately selects on `app` only (no `version`) so that in the
  # production blue/green overlays this single Service can front pods from
  # either the blue or green Deployment. Traffic cutover is done by
  # `kubectl patch service api-service -n production -p '{"spec":{"selector":{"version":"green"}}}'`
  # per the CI/CD workflow, which layers a `version` selector on top of this.
  selector:
    app: api-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
