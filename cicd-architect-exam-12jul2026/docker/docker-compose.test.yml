version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=testdb
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  api-service:
    build:
      context: ../apps/api-service
      dockerfile: ../../docker/Dockerfile.api-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=test
      - APP_VERSION=test
      - DATABASE_URL=postgresql://test:test@postgres:5432/testdb
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - FEATURE_NEW_UI=true
      - FEATURE_ANALYTICS=false
      - FEATURE_BETA=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  worker-service:
    build:
      context: ../apps/worker-service
      dockerfile: ../../docker/Dockerfile.worker-service
    environment:
      - ENVIRONMENT=test
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://test:test@postgres:5432/testdb
      - METRICS_PORT=9100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker inspect ping -d celery@$$HOSTNAME"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

networks:
  test-network:
    driver: bridge
