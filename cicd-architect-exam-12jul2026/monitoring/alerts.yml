groups:
  - name: api-service-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(api_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(api_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on api-service"
          description: "More than 5% of requests to api-service have returned a 5xx status over the last 5 minutes (current value: {{ $value | humanizePercentage }})."

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(api_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on api-service"
          description: "p95 request duration for api-service has exceeded 500ms for 5 minutes (current value: {{ $value | humanizeDuration }})."

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} (job {{ $labels.job }}) for over 1 minute."

      - alert: HighMemoryUsage
        expr: |
          (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.name }}"
          description: "Container {{ $labels.name }} is using more than 85% of its memory limit for 5 minutes. Requires cAdvisor/container metrics to be scraped."

      - alert: WorkerTaskFailureRateHigh
        expr: |
          (
            sum(rate(worker_tasks_total{status="failure"}[5m]))
            /
            sum(rate(worker_tasks_total[5m]))
          ) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Celery task failure rate on worker-service"
          description: "More than 10% of worker-service tasks have failed over the last 5 minutes (current value: {{ $value | humanizePercentage }})."

      - alert: NoRequestsReceived
        expr: |
          sum(rate(api_requests_total[10m])) == 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "api-service has received no traffic"
          description: "api-service has not processed any requests in the last 10 minutes. May indicate an upstream routing problem or idle environment."
